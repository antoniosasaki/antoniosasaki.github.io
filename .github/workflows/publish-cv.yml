name: Publish CV PDF

on:
  push:
    branches: [master]
    paths:
      - '_includes/cv_pdf/part6.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild CV PDF
        shell: bash
        run: |
          cat _includes/cv_pdf/part0.txt \
              _includes/cv_pdf/part1.txt \
              _includes/cv_pdf/part2.txt \
              _includes/cv_pdf/part3.txt \
              _includes/cv_pdf/part4.txt \
              _includes/cv_pdf/part5.txt \
              _includes/cv_pdf/part6.txt \
              > assets/pdf/Antonio_Sasaki_CV_one-page.pdf
          echo '3a2b8b0b9b2fa8e365c8ab3bac087d1a6c49e9c25164e73a86f2b1a4cf482f05  assets/pdf/Antonio_Sasaki_CV_one-page.pdf' | sha256sum -c -
      - name: Commit updated CV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pdf/Antonio_Sasaki_CV_one-page.pdf
          git rm -r _includes/cv_pdf
          git commit -m 'Update CV PDF'
          git push
